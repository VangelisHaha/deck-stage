<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK_TITLE</title>

<!-- 框架样式：固定层，不要改。风格在下面自己的 <style> 里覆盖 -->
<link rel="stylesheet" href="deck.css">

<style>
/* ============================================================
   这份稿子的风格层 —— 想怎么改都行

   1) 换肤：覆盖 deck.css 声明的那几个变量就够了
   2) 排版与组件：kicker / 标题 / 卡片 / 栅格 / 表格… 全部自己写

   框架只认这几个结构类，别的都归你：
     .slide  .slide.on  .slide.cover  .body  .body.vc
     .an .pop .sl  .d1~.d16      入场动画
     .footer .steps .st .pno     页脚（由 deck.js 注入，改样式即可）
     .imgslot[data-src]          自动装载的图位
     [data-avatar]               自动装载的小头像
   ============================================================ */

:root{
  /* --- 换肤：改这几个就够 --- */
  --bg0:#101014;

  --ink:#FFFFFF;
  --ink2:#E8E8EE;
  --ink3:#AAAAB8;
  --ink4:#77778A;
  --ink5:#4C4C5C;

  --line:rgba(170,170,184,.16);
  --line2:rgba(170,170,184,.30);

  --accent:#5B8CFF;
  --accent2:#FFC94D;
  --accent3:#3FD9A8;
  --accent-dim:rgba(91,140,255,.14);
  --accent2-dim:rgba(255,201,77,.13);
  --accent3-dim:rgba(63,217,168,.13);
}

/* --- 背景：随便画，#bg 撑满整张画布 --- */
#bg{background:linear-gradient(165deg,#16161C 0%,#101014 55%,#1A1A22 100%);}

/* --- 排版：下面全是示例，按稿子需要重写 --- */
.kicker{display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px;}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),transparent);}
.kicker .ch{color:var(--ink4);letter-spacing:.08em;font-weight:600;text-transform:none;}

h2.t{font-size:47px;line-height:1.14;font-weight:800;color:var(--ink);margin-bottom:16px;}
h2.t em{font-style:normal;color:var(--accent2);}

.sub{font-size:17.5px;line-height:1.62;color:var(--ink3);max-width:1180px;margin-bottom:26px;}
.sub b{color:var(--ink);font-weight:700;}

.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}

.card{border-radius:18px;padding:24px 26px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);}
.card h4{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:9px;}
.card p{font-size:14.6px;line-height:1.68;color:var(--ink3);}
.card p+p{margin-top:8px;}

.punch{border-radius:16px;padding:20px 26px;border:1px solid var(--line2);
  background:var(--accent-dim);}
.punch p{font-size:19px;line-height:1.6;color:var(--ink);font-weight:700;}
.punch p .hl{color:var(--accent2);}
.punch small{display:block;margin-top:7px;font-size:14px;font-weight:400;color:var(--ink3);}

/* --- 封面 --- */
.cover h1{font-size:72px;line-height:1.1;font-weight:800;color:var(--ink);text-align:center;}
.cover .csub{margin-top:18px;font-size:20px;color:var(--ink3);text-align:center;}

/* --- 幕间页 --- */
.act{align-items:center;justify-content:center;}
.act .anum{font-family:var(--mono);font-size:120px;font-weight:800;color:var(--accent);
  line-height:1;opacity:.9;}
.act .atxt{text-align:center;margin-top:18px;}
.act .atxt h2{font-size:44px;font-weight:800;color:var(--ink);}
.act .atxt h2 em{font-style:normal;color:var(--accent2);}
.act .atxt p{margin-top:14px;font-size:18px;color:var(--ink3);max-width:820px;}
</style>

<script>
/* 演讲者视图开关：尽早打到 <html> 上，避免闪现一帧观众视图 */
if(new URLSearchParams(location.search).has('notes'))
  document.documentElement.classList.add('pv');
</script>
</head>
<body>

<!-- ══════════════ 工具条 · 框架结构，别改 id ══════════════ -->
<div id="tools">
  <button id="btnPV">⧉ 演讲者视图</button>
  <button id="btnPptx">⬇ 导出 PPTX</button>
  <button id="btnFull">⛶ 全屏</button>
</div>
<div id="toast"></div>

<!-- ══════════════ 演讲者视图 · ?notes=1 · 框架结构，别改 ══════════════ -->
<div id="pv">
  <div class="pvtop">
    <div class="pvno"><b id="pvNo">01</b> / <span id="pvTot">00</span></div>
    <div class="pvttl" id="pvTitle">—</div>
    <div class="pvclock">
      <span class="pvtot" id="pvElapsed">00:00</span>
      <span class="pvpg" id="pvPage">0:00 / 0:00</span>
    </div>
    <div class="pvlink" id="pvLink"><i></i><em>未连主屏</em></div>
    <div class="pvnav">
      <button id="pvPrev" title="上一页（← 也行）">◀</button>
      <button id="pvNext" title="下一页（→ 也行）">▶</button>
      <button id="pvFold" title="收起 / 展开幻灯预览">▤</button>
    </div>
  </div>
  <div class="pvwarn" id="pvWarn"></div>
  <div class="pvbody" id="pvBody"></div>
  <div class="pvshots" id="pvShots"></div>
</div>

<div id="stage">
  <div id="bg"></div>
  <div id="prog"></div>
  <div id="slides">

<!-- ══════════════ 01 封面 ══════════════
     每页一个 <section class="slide">，data-t 是这一页的唯一名字：
       · 演讲者视图靠它找台词（notes.js 的 key）
       · 圆点导航、预览条的标题也用它
       · 增删页不会错位，但改名要同步改 notes.js
     页码、页脚台阶条由 deck.js 自动注入，不要手写。          -->
<section class="slide cover" data-t="封面">
  <div>
    <h1 class="an d1">DECK_TITLE</h1>
    <p class="csub an d2">副标题 · 讲者 · 日期</p>
  </div>
</section>

<!-- ══════════════ 02 幕间页 ══════════════
     data-t 用「第一幕」这类名字，配合 deck.config.js 的 rail.map
     就能让后面每一页自动带上台阶指示。                       -->
<section class="slide act" data-t="第一幕">
  <div class="anum an pop d1">01</div>
  <div class="atxt">
    <h2 class="an d2">这一幕讲什么，<em>一句话</em></h2>
    <p class="an d3">一两句铺垫，说清这一幕要解决的问题。</p>
  </div>
</section>

<!-- ══════════════ 03 内容页 ══════════════
     常规结构：kicker → h2.t → p.sub → .body → .punch
     .body 里排版随意；要垂直居中就写 class="body vc"。      -->
<section class="slide" data-t="示例内容页">
  <div class="kicker an d1">Section <span class="ch">· 小标题</span></div>
  <h2 class="t an d1">陈述句，<em>然后是转折</em></h2>
  <p class="sub an d2">一到两行副标题。超过两行说明这页塞太多了，该拆。</p>
  <div class="body">
    <div class="grid g3 an d3">
      <div class="card an d3"><h4>卡片一</h4><p>正文。</p></div>
      <div class="card an d4"><h4>卡片二</h4><p>正文。</p></div>
      <div class="card an d5"><h4>卡片三</h4><p>正文。</p></div>
    </div>
    <!-- 图位：文件丢进 assets/demo.png 就自动换成图，不在则保留虚线框。
         千万别写死 <img src>，否则图没就位时页面会留个空洞。 -->
    <div class="imgslot an d6" style="flex:1;margin-top:18px"
         data-src="assets/demo.png" data-alt="图的说明，也是灯箱标题">
      <div class="ic">🖼</div>
    </div>
    <div class="punch an d7" style="margin-top:18px">
      <p>这一页的落点，<span class="hl">一句收口</span>。
      <small>补充细节放这里，字号会自动小一号。</small></p>
    </div>
  </div>
</section>

  </div>
</div>
<div id="dots"></div>

<!-- ══════════════ 图片灯箱 · 框架结构，别改 ══════════════ -->
<div id="lb">
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="bar">
    <button data-lb="out">−</button>
    <span class="pct" id="lbPct">100%</span>
    <button data-lb="in">+</button>
    <button data-lb="fit">复位</button>
    <button data-lb="close">✕ 关闭</button>
  </div>
  <div class="cap"><b id="lbCap"></b>
    <span class="hint">滚轮缩放 · 拖拽平移 · 双击放大 · Esc 关闭</span>
  </div>
</div>

<!-- 加载顺序固定：config → notes → 导出库 → 内核 -->
<script src="deck.config.js"></script>
<script src="notes.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/pptxgen.bundle.js"></script>
<script src="deck.js"></script>

<script>
/* ============================================================
   这份稿子专属的脚本写在这里：SVG 图表、特效、数据数组等。
   不要往 deck.js 里塞。
   注意：这段在 deck.js 之后执行，可以用 window.__go / __slides /
   __toast / __assetsReady 这些钩子。
   ============================================================ */
</script>
</body>
</html>
