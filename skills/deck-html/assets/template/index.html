<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DECK_TITLE</title>
<link rel="stylesheet" href="/_deckstage/deck.css">
<style>
/* 这份稿子的风格：覆盖内核的变量换肤，排版和组件全部自己写 */
:root{
  --bg0:#101014;
  --ink:#FFFFFF; --ink2:#E8E8EE; --ink3:#AAAAB8; --ink4:#77778A; --ink5:#4C4C5C;
  --line:rgba(170,170,184,.16); --line2:rgba(170,170,184,.30);
  --accent:#5B8CFF; --accent2:#FFC94D; --accent3:#3FD9A8;
  --accent-dim:rgba(91,140,255,.14); --accent2-dim:rgba(255,201,77,.13); --accent3-dim:rgba(63,217,168,.13);
}
#bg{background:linear-gradient(165deg,#16161C 0%,#101014 55%,#1A1A22 100%);}

.kicker{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;
  letter-spacing:.20em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),transparent);}
.kicker .ch{color:var(--ink4);letter-spacing:.08em;font-weight:600;text-transform:none;}
h2.t{font-size:47px;line-height:1.14;font-weight:800;color:var(--ink);margin-bottom:16px;}
h2.t em{font-style:normal;color:var(--accent2);}
.sub{font-size:17.5px;line-height:1.62;color:var(--ink3);max-width:1180px;margin-bottom:26px;}
.sub b{color:var(--ink);font-weight:700;}
.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
.card{border-radius:18px;padding:24px 26px;border:1px solid var(--line);background:rgba(255,255,255,.03);}
.card h4{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:9px;}
.card p{font-size:14.6px;line-height:1.68;color:var(--ink3);}
.punch{border-radius:16px;padding:20px 26px;border:1px solid var(--line2);background:var(--accent-dim);}
.punch p{font-size:19px;line-height:1.6;color:var(--ink);font-weight:700;}
.punch p .hl{color:var(--accent2);}
.punch small{display:block;margin-top:7px;font-size:14px;font-weight:400;color:var(--ink3);}
.cover h1{font-size:72px;line-height:1.1;font-weight:800;color:var(--ink);text-align:center;}
.cover .csub{margin-top:18px;font-size:20px;color:var(--ink3);text-align:center;}
.act{align-items:center;justify-content:center;}
.act .anum{font-family:var(--mono);font-size:120px;font-weight:800;color:var(--accent);line-height:1;opacity:.9;}
.act .atxt{text-align:center;margin-top:18px;}
.act .atxt h2{font-size:44px;font-weight:800;color:var(--ink);}
.act .atxt h2 em{font-style:normal;color:var(--accent2);}
.act .atxt p{margin-top:14px;font-size:18px;color:var(--ink3);max-width:820px;}
</style>
</head>
<body>

<div id="bg"></div>

<section class="slide cover" data-t="封面">
  <div>
    <h1 class="an d1">DECK_TITLE</h1>
    <p class="csub an d2">副标题 · 讲者 · 日期</p>
  </div>
</section>

<section class="slide act" data-t="第一幕">
  <div class="anum an pop d1">01</div>
  <div class="atxt">
    <h2 class="an d2">这一幕讲什么，<em>一句话</em></h2>
    <p class="an d3">一两句铺垫，说清这一幕要解决的问题。</p>
  </div>
</section>

<section class="slide" data-t="示例内容页">
  <div class="kicker an d1">Section <span class="ch">· 小标题</span></div>
  <h2 class="t an d1">陈述句，<em>然后是转折</em></h2>
  <p class="sub an d2">一到两行副标题。超过两行说明这页塞太多了，该拆。</p>
  <div class="body">
    <div class="grid g3" data-seq="300 380">
      <div class="card q"><h4>卡片一</h4><p>正文。</p></div>
      <div class="card q"><h4>卡片二</h4><p>正文。</p></div>
      <div class="card q"><h4>卡片三</h4><p>正文。</p></div>
    </div>
    <div class="imgslot an d6" style="flex:1;margin-top:18px" data-src="assets/demo.png" data-alt="图的说明，也是灯箱标题">
      <div class="ic">🖼</div>
    </div>
    <div class="punch an d7" style="margin-top:18px">
      <p>这一页的落点，<span class="hl">一句收口</span>。<small>补充细节放这里。</small></p>
    </div>
  </div>
</section>

<script src="notes.js"></script>
<script src="/_deckstage/deck.js"></script>
</body>
</html>
